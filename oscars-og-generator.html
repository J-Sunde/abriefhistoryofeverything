<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OG Image Generator — A (Brief) History of the Oscars</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--ui:#F5F0E8;--ui1:#EDE6D6;--ui2:#E2D9C4;--rule:rgba(0,0,0,.1);--text:#1A1410;--dim:rgba(0,0,0,.55);--muted:rgba(0,0,0,.35);--gold:#C9A84C;--crimson:#8B1A2C;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{background:var(--ui);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;display:flex;flex-direction:column;}
.top-bar{height:48px;background:var(--ui1);border-bottom:1px solid var(--rule);display:flex;align-items:center;padding:0 24px;gap:12px;flex-shrink:0;}
.top-bar-title{font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:500;}
.top-bar-title span{color:var(--gold);}
.tbbtns{margin-left:auto;display:flex;gap:8px;}
.btn{background:#0A0804;color:var(--gold);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;border:none;padding:7px 18px;cursor:pointer;transition:opacity .15s;}
.btn:hover{opacity:.8;}.btn.sec{background:transparent;color:#0A0804;border:1px solid rgba(0,0,0,.25);}.btn.sec:hover{background:rgba(0,0,0,.06);opacity:1;}.btn:disabled{opacity:.4;cursor:default;}
.app{flex:1;display:flex;overflow:hidden;}
/* LEFT CONTROLS */
.ctrl{width:280px;background:var(--ui1);border-right:1px solid var(--rule);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0;}
.ctrl::-webkit-scrollbar{width:4px;}.ctrl::-webkit-scrollbar-thumb{background:rgba(0,0,0,.1);}
.cs{padding:16px;border-bottom:1px solid var(--rule);}
.cl{font-family:'DM Sans',sans-serif;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:10px;}
/* Layout buttons */
.layout-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-bottom:4px;}
.lbtn{padding:6px 4px;border:1px solid rgba(0,0,0,.12);background:transparent;color:var(--dim);font-family:'DM Sans',sans-serif;font-size:10px;cursor:pointer;text-align:center;transition:all .12s;border-radius:1px;}
.lbtn:hover{border-color:rgba(0,0,0,.3);color:var(--text);}.lbtn.active{border-color:var(--gold);color:#8B6914;background:rgba(201,168,76,.1);}
/* BG swatches */
.bg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-bottom:4px;}
.bgsw{padding:8px 4px;border:2px solid rgba(0,0,0,.1);border-radius:1px;cursor:pointer;text-align:center;font-family:'DM Sans',sans-serif;font-size:9px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;transition:all .12s;color:var(--dim);}
.bgsw:hover{border-color:rgba(0,0,0,.3);}.bgsw.active{border-color:var(--gold);}
/* Image thumbnails */
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
.img-thumb{cursor:pointer;border:2px solid transparent;border-radius:1px;overflow:hidden;aspect-ratio:1;background:var(--ui2);transition:all .12s;display:flex;align-items:center;justify-content:center;}
.img-thumb:hover{border-color:rgba(0,0,0,.25);}.img-thumb.active{border-color:var(--gold);}
.img-thumb img{width:100%;height:100%;object-fit:cover;filter:grayscale(.3) sepia(.2);}
.fb{font-family:'DM Sans',sans-serif;font-size:7px;color:var(--muted);text-align:center;padding:4px;line-height:1.3;font-weight:500;}
/* Sliders */
.slider-row{display:flex;align-items:center;gap:8px;margin-top:4px;}
.slider{flex:1;-webkit-appearance:none;appearance:none;height:2px;background:rgba(0,0,0,.15);border-radius:2px;outline:none;cursor:pointer;}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--gold);cursor:pointer;}
.slider::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--gold);border:none;cursor:pointer;}
.slval{font-family:'DM Sans',sans-serif;font-size:10px;color:#8B6914;width:32px;text-align:right;flex-shrink:0;font-weight:500;}
/* Text inputs */
.tinput,.tarea{width:100%;background:var(--ui2);border:1px solid rgba(0,0,0,.12);color:var(--text);font-family:'DM Sans',sans-serif;font-size:11px;padding:7px 9px;outline:none;border-radius:1px;margin-top:4px;line-height:1.4;}
.tinput:focus,.tarea:focus{border-color:var(--gold);}
.tarea{resize:none;}
/* Toggle */
.tgl-row{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:4px;}
.tgl{padding:6px 4px;border:1px solid rgba(0,0,0,.12);background:transparent;color:var(--dim);font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;cursor:pointer;text-align:center;transition:all .12s;border-radius:1px;}
.tgl:hover{border-color:rgba(0,0,0,.3);color:var(--text);}.tgl.active{border-color:var(--gold);color:#8B6914;background:rgba(201,168,76,.1);}
/* CANVAS AREA */
.canvas-area{flex:1;overflow-y:auto;padding:30px;background:#1A1410;display:flex;flex-direction:column;align-items:center;gap:20px;}
.canvas-area::-webkit-scrollbar{width:5px;}.canvas-area::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);}
.cw{display:flex;flex-direction:column;gap:8px;width:100%;max-width:620px;}
.cm{display:flex;align-items:center;gap:8px;}
.cn{font-family:'DM Sans',sans-serif;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.35);font-weight:500;}
.cd{font-family:'DM Sans',sans-serif;font-size:9px;color:rgba(255,255,255,.2);margin-left:auto;}
.dlb{background:transparent;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.45);font-family:'DM Sans',sans-serif;font-size:9px;font-weight:500;letter-spacing:.1em;padding:3px 10px;cursor:pointer;transition:all .12s;text-transform:uppercase;border-radius:1px;}
.dlb:hover{border-color:var(--gold);color:var(--gold);}
.cf{border:1px solid rgba(255,255,255,.08);overflow:hidden;position:relative;flex-shrink:0;background:#0A0804;}
.cf.og{width:600px;height:315px;}
.cf.tw{width:600px;height:338px;}
</style>
</head>
<body>
<div class="top-bar">
  <div class="top-bar-title">OG Image Generator — <span>A (Brief) History of the Oscars</span></div>
  <div class="tbbtns">
    <button class="btn sec" onclick="dlC('tw')">↓ Twitter / X PNG</button>
    <button class="btn" onclick="dlC('og')">↓ OG / Facebook PNG</button>
  </div>
</div>
<div class="app">
<div class="ctrl">

  <div class="cs">
    <div class="cl">Layout</div>
    <div class="layout-grid">
      <button class="lbtn active" data-layout="title|image" onclick="selLayout(this)">Title | Image</button>
      <button class="lbtn" data-layout="image|title" onclick="selLayout(this)">Image | Title</button>
      <button class="lbtn" data-layout="title|color" onclick="selLayout(this)">Title | Color</button>
    </div>
  </div>

  <div class="cs">
    <div class="cl">Title Background</div>
    <div class="bg3">
      <div class="bgsw active" data-bg="dark" onclick="selBg(this)" style="background:#0A0804;color:var(--gold);">Noir</div>
      <div class="bgsw" data-bg="gold" onclick="selBg(this)" style="background:#C9A84C;color:#0A0804;">Gold</div>
      <div class="bgsw" data-bg="ivory" onclick="selBg(this)" style="background:#F8F3E8;color:#8B6914;border-color:#ddd;">Ivory</div>
      <div class="bgsw" data-bg="crimson" onclick="selBg(this)" style="background:#8B1A2C;color:#E8C96A;">Crimson</div>
      <div class="bgsw" data-bg="charcoal" onclick="selBg(this)" style="background:#1C1810;color:var(--gold);">Charcoal</div>
    </div>
  </div>

  <div class="cs">
    <div class="cl">Title Case</div>
    <div class="tgl-row">
      <button class="tgl active" id="tgl-caps" onclick="selCase(false)">ALL CAPS</button>
      <button class="tgl" id="tgl-tc" onclick="selCase(true)">Title Case</button>
    </div>
  </div>

  <div class="cs">
    <div class="cl">Title Size</div>
    <div class="slider-row">
      <input class="slider" id="sz-slider" type="range" min="28" max="100" value="64" oninput="setSize(this.value)">
      <span class="slval" id="sz-val">64px</span>
    </div>
  </div>

  <div class="cs">
    <div class="cl">Subtitle</div>
    <textarea class="tarea" id="subtitle" rows="2" oninput="render()">97 years. One gold statue. Endless politics.</textarea>
  </div>

  <div class="cs">
    <div class="cl">Right Panel — Image</div>
    <div class="igrid" style="margin-bottom:8px;">
      <div class="img-thumb active" data-img="images/oscar-statue.png" onclick="selImg(this)"><img src="images/oscar-statue.png" alt="" onerror="this.parentElement.innerHTML='<div class=fb>Statue</div>'"></div>
      <div class="img-thumb" data-img="images/scarlett-ohara.jpg" onclick="selImg(this)"><img src="images/scarlett-ohara.jpg" alt="" onerror="this.parentElement.innerHTML='<div class=fb>Scarlett</div>'"></div>
      <div class="img-thumb" data-img="images/hattie-mcdaniel.png" onclick="selImg(this)"><img src="images/hattie-mcdaniel.png" alt="" onerror="this.parentElement.innerHTML='<div class=fb>McDaniel</div>'"></div>
      <div class="img-thumb" data-img="images/casablanca.jpg" onclick="selImg(this)"><img src="images/casablanca.jpg" alt="" onerror="this.parentElement.innerHTML='<div class=fb>Casablanca</div>'"></div>
      <div class="img-thumb" data-img="images/schindlers-list.jpg" onclick="selImg(this)"><img src="images/schindlers-list.jpg" alt="" onerror="this.parentElement.innerHTML='<div class=fb>Schindler</div>'"></div>
      <div class="img-thumb" data-img="images/goodfellas.jpg" onclick="selImg(this)"><img src="images/goodfellas.jpg" alt="" onerror="this.parentElement.innerHTML='<div class=fb>Goodfellas</div>'"></div>
      <div class="img-thumb" data-img="images/hollywood-sign.jpg" onclick="selImg(this)"><img src="images/hollywood-sign.jpg" alt="" onerror="this.parentElement.innerHTML='<div class=fb>Hollywood</div>'"></div>
    </div>
    <div class="cl" style="margin-top:4px;">Or Color Panel</div>
    <div class="igrid" style="margin-top:6px;">
      <div class="img-thumb" data-img="none" data-color="#0A0804" onclick="selImg(this)" style="background:#0A0804;border:1px solid #333;"><div class="fb" style="color:#C9A84C;">NOIR</div></div>
      <div class="img-thumb" data-img="none" data-color="#C9A84C" onclick="selImg(this)" style="background:#C9A84C;"><div class="fb" style="color:#0A0804;font-weight:700;">GOLD</div></div>
      <div class="img-thumb" data-img="none" data-color="#8B1A2C" onclick="selImg(this)" style="background:#8B1A2C;"><div class="fb" style="color:#E8C96A;font-weight:700;">CRIMSON</div></div>
      <div class="img-thumb" data-img="none" data-color="#1C1810" onclick="selImg(this)" style="background:#1C1810;border:1px solid #333;"><div class="fb" style="color:#C9A84C;">CHARCOAL</div></div>
      <div class="img-thumb" data-img="none" data-color="#F8F3E8" onclick="selImg(this)" style="background:#F8F3E8;border:1px solid #ddd;"><div class="fb" style="color:#8B6914;font-weight:700;">IVORY</div></div>
      <div class="img-thumb" data-img="none" data-color="#2A1F0A" onclick="selImg(this)" style="background:#2A1F0A;"><div class="fb" style="color:#C9A84C;">DEEP</div></div>
    </div>
  </div>

</div>

<div class="canvas-area">
  <div class="cw">
    <div class="cm"><span class="cn">OG / Facebook</span><span class="cd">1200×630</span><button class="dlb" onclick="dlC('og')">↓ PNG</button></div>
    <div class="cf og" id="canvas-og"></div>
  </div>
  <div class="cw">
    <div class="cm"><span class="cn">Twitter / X</span><span class="cd">1200×675</span><button class="dlb" onclick="dlC('tw')">↓ PNG</button></div>
    <div class="cf tw" id="canvas-tw"></div>
  </div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
const S={
  layout:"title|image",
  bg:"dark",
  titleCase:false,
  titleSize:64,
  img:"images/oscar-statue.png",
  panelColor:"#C9A84C",
  subtitle:"97 years. One gold statue. Endless politics."
};

const BG={
  dark:{bg:"#0A0804",title:"#F5E4A8",label:"rgba(255,255,255,.5)",sub:"rgba(201,168,76,.75)",accent:"#C9A84C"},
  gold:{bg:"#C9A84C",title:"#0A0804",label:"rgba(0,0,0,.5)",sub:"rgba(0,0,0,.6)",accent:"#0A0804"},
  ivory:{bg:"#F8F3E8",title:"#0A0804",label:"rgba(0,0,0,.45)",sub:"rgba(139,105,20,.8)",accent:"#8B6914"},
  crimson:{bg:"#8B1A2C",title:"#F5E4A8",label:"rgba(255,255,255,.5)",sub:"rgba(232,201,106,.75)",accent:"#E8C96A"},
  charcoal:{bg:"#1C1810",title:"#F5E4A8",label:"rgba(255,255,255,.45)",sub:"rgba(201,168,76,.7)",accent:"#C9A84C"}
};

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function render(){
  const sub=document.getElementById("subtitle").value||"97 years. One gold statue. Endless politics.";
  S.subtitle=sub;
  ["og","tw"].forEach(fmt=>{
    const el=document.getElementById("canvas-"+fmt);
    const isOG=fmt==="og";
    const W=600,H=isOG?315:338;
    const b=BG[S.bg];
    const tc=S.titleCase;
    const titleHTML=tc?`The <em style="color:${b.accent};font-style:italic;">Oscars</em>`:`THE <em style="color:${b.accent};font-style:italic;">OSCARS_</em>`;
    const ts=S.titleSize;
    const useImg=S.img&&S.img!=="none";
    const bright=["#C9A84C","#F8F3E8","#E8C96A","#F5E4A8"];
    const dot=bright.some(c=>S.panelColor.toUpperCase()===c.toUpperCase())?"rgba(0,0,0,.08)":"rgba(201,168,76,.12)";

    const titlePanel=`<div style="flex:1;background:${b.bg};display:flex;flex-direction:column;justify-content:center;padding:${isOG?"10% 9%":"9% 8%"};position:relative;overflow:hidden;">
      <div style="font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:${b.label};font-weight:500;margin-bottom:${isOG?"12":"10"}px;">A (Brief) History of</div>
      <div style="font-family:'Cormorant Garamond',serif;font-weight:700;font-size:${ts}px;line-height:.88;letter-spacing:-.01em;color:${b.title};padding-bottom:${isOG?"16":"12"}px;text-transform:uppercase;">${titleHTML}</div>
      <div style="font-family:'DM Sans',sans-serif;font-size:${isOG?"12":"11"}px;color:${b.sub};line-height:1.55;max-width:90%;font-weight:300;">${esc(sub)}</div>
      <div style="position:absolute;bottom:-8px;right:-4px;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:180px;color:${b.accent};opacity:.05;line-height:1;pointer-events:none;user-select:none;font-style:italic;">★</div>
    </div>`;

    const rightPanel=useImg
      ?`<div style="flex:1;position:relative;overflow:hidden;background-image:url('${S.img}');background-size:cover;background-position:center top;"><div style="position:absolute;inset:0;background:linear-gradient(90deg,${b.bg}22 0%,transparent 40%);"></div></div>`
      :`<div style="flex:1;position:relative;overflow:hidden;background:${S.panelColor};"><div style="position:absolute;inset:0;background-image:radial-gradient(circle,${dot} 1px,transparent 1px);background-size:20px 20px;"></div><div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#C9A84C,#E8C96A,#C9A84C);opacity:.6;"></div></div>`;

    const panels=S.layout==="image|title"?rightPanel+titlePanel:titlePanel+rightPanel;
    el.innerHTML=`<div style="width:100%;height:100%;display:flex;flex-direction:row;overflow:hidden;">${panels}</div>`;
  });
}

window.selLayout=function(el){document.querySelectorAll("[data-layout]").forEach(b=>b.classList.remove("active"));el.classList.add("active");S.layout=el.dataset.layout;render();};
window.selBg=function(el){document.querySelectorAll("[data-bg]").forEach(b=>b.classList.remove("active"));el.classList.add("active");S.bg=el.dataset.bg;render();};
window.selCase=function(tc){S.titleCase=tc;document.getElementById("tgl-caps").classList.toggle("active",!tc);document.getElementById("tgl-tc").classList.toggle("active",tc);render();};
window.setSize=function(v){S.titleSize=parseInt(v);document.getElementById("sz-val").textContent=v+"px";render();};
window.selImg=function(el){document.querySelectorAll(".img-thumb").forEach(i=>i.classList.remove("active"));el.classList.add("active");S.img=el.dataset.img;S.panelColor=el.dataset.color||"#C9A84C";
  // if color panel selected and layout is title|image, switch to title|color
  if(S.img==="none"&&S.layout==="title|image"){S.layout="title|color";document.querySelectorAll("[data-layout]").forEach(b=>b.classList.toggle("active",b.dataset.layout===S.layout));}
  else if(S.img!=="none"&&S.layout==="title|color"){S.layout="title|image";document.querySelectorAll("[data-layout]").forEach(b=>b.classList.toggle("active",b.dataset.layout===S.layout));}
  render();};

document.getElementById("subtitle").addEventListener("input",render);

function d2b(d){const a=d.split(","),m=a[0].match(/:(.*?);/)[1],b=atob(a[1]);let n=b.length;const u=new Uint8Array(n);while(n--)u[n]=b.charCodeAt(n);return new Blob([u],{type:m});}
function c2b(fmt){
  return new Promise((res,rej)=>{
    const el=document.getElementById("canvas-"+fmt);
    const bg=BG[S.bg].bg;
    html2canvas(el,{scale:2,useCORS:true,allowTaint:true,backgroundColor:bg,logging:false})
      .then(c=>{if(c.toBlob)c.toBlob(b=>res(b||d2b(c.toDataURL("image/png"))),"image/png");else res(d2b(c.toDataURL("image/png")));}).catch(rej);
  });
}
function trig(blob,name){const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),2000);}

window.dlC=function(fmt){
  c2b(fmt).then(b=>trig(b,`og-oscars-${fmt}.png`)).catch(()=>alert("Export failed. Serve over HTTP."));
};

render();
})();
</script>
</body>
</html>
